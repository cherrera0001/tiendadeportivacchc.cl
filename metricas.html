<!DOCTYPE html>
<html lang="es-CL">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Métricas | Cámara CCHC</title>
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
  <main class="seccion">
    <div class="contenedor">
      <header class="seccion__encabezado">
        <h1>Métricas de la tienda</h1>
        <p>Embudo y stock desde la base local. El contador público del hero no es el mismo que <code>page_view</code>.</p>
      </header>
      <p id="estado-metricas" class="resultado-conteo">Cargando…</p>
      <div class="grilla-beneficios" id="tarjetas-metricas"></div>
      <p><a class="boton boton--fantasma" href="/">Volver a la tienda</a></p>
    </div>
  </main>
  <script>
    const fmt = new Intl.NumberFormat('es-CL');
    const clp = new Intl.NumberFormat('es-CL', { style: 'currency', currency: 'CLP', maximumFractionDigits: 0 });
    fetch('/api/metricas')
      .then((r) => r.json())
      .then((m) => {
        document.getElementById('estado-metricas').textContent = 'Datos en vivo desde /api/metricas.';
        const items = [
          ['Visitas (page_view)', fmt.format(m.visitas)],
          ['Visitas vitrina (cookie 30 min)', fmt.format(m.visitasVitrina)],
          ['Add to cart', fmt.format(m.carritos)],
          ['Checkouts', fmt.format(m.checkouts)],
          ['Compras', fmt.format(m.compras)],
          ['Conversión visita → compra', (m.conversion * 100).toFixed(2) + ' %'],
          ['Ticket promedio', clp.format(m.ticket || 0)],
          ['Ingresos', clp.format(m.ingresos || 0)],
          ['Suscriptores activos', fmt.format(m.suscriptores)],
          ['Productos activos', fmt.format(m.productos)],
          ['Stock bajo (≤ 5)', fmt.format(m.stockBajo)],
          ['Quiebre (stock 0)', fmt.format(m.quiebre)],
          ['Evaluación promedio', String(m.evaluacion).replace('.', ',')]
        ];
        document.getElementById('tarjetas-metricas').innerHTML = items.map(([t, d]) =>
          `<article class="beneficio"><h3>${t}</h3><p>${d}</p></article>`
        ).join('');
      })
      .catch(() => {
        document.getElementById('estado-metricas').textContent = 'No se pudieron cargar las métricas. ¿Está corriendo npm run dev?';
      });
  </script>
</body>
</html>
