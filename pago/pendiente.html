<!DOCTYPE html>
<html lang="es-CL">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pago pendiente | Cámara</title>
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
  <main class="seccion">
    <div class="contenedor pago-estado">
      <p class="etiqueta">Checkout</p>
      <h1>Pago pendiente</h1>
      <p>Tu pedido <strong id="codigo">—</strong> está a la espera de confirmación.</p>
      <p id="nota-mp">Si pagaste con Mercado Pago, el stock se descuenta cuando el cobro figure como aprobado.</p>
      <div id="caja-simular" class="oculto" hidden>
        <p>Entorno local: no hay Access Token de Mercado Pago. Puedes simular un cobro aprobado para probar stock y métricas.</p>
        <button class="boton boton--primario" id="btn-simular" type="button">Simular pago aprobado</button>
        <p class="mensaje-formulario" id="mensaje-simular" role="status"></p>
      </div>
      <p><a class="boton boton--fantasma" href="/">Volver a la tienda</a></p>
    </div>
  </main>
  <script>
    const params = new URLSearchParams(location.search);
    const codigo = params.get('codigo') || params.get('external_reference') || '';
    document.getElementById('codigo').textContent = codigo || '—';
    const simular = params.get('simular') === '1';
    const caja = document.getElementById('caja-simular');
    if (simular && codigo) {
      caja.hidden = false;
      caja.classList.remove('oculto');
      document.getElementById('nota-mp').classList.add('oculto');
    }
    document.getElementById('btn-simular')?.addEventListener('click', async () => {
      const mensaje = document.getElementById('mensaje-simular');
      const boton = document.getElementById('btn-simular');
      boton.disabled = true;
      mensaje.textContent = 'Confirmando…';
      try {
        const resp = await fetch('/api/dev/simular-pago', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ codigo })
        });
        const data = await resp.json();
        if (!resp.ok) throw new Error(data.mensaje || 'No se pudo simular');
        location.href = data.redirect || ('/pago/exito.html?codigo=' + encodeURIComponent(codigo));
      } catch (err) {
        mensaje.className = 'mensaje-formulario error';
        mensaje.textContent = err.message;
        boton.disabled = false;
      }
    });
  </script>
</body>
</html>
